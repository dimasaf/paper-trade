[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trade-api"
version = "0.1.0"
description = "Solana Smart Wallet research and Paper Trading backend"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["paper_trade"]
